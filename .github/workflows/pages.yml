# Publishes site/ (plain HTML and CSS) to GitHub Pages, with the pages ocntools makes of it: `ocntools site build`, SITE_URL says where.
# Pages use the "GitHub Actions" source (set once: gh api -X POST repos/sachahjkl/opencode_native/pages -f build_type=workflow).
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "CHANGELOG.md"
      - "tools/ocntools/**"
      - ".github/actions/setup-odin-tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # (ocntools signs with the toolkit's update package)
      - uses: actions/configure-pages@v6
      - uses: ./.github/actions/setup-odin-tools
      - run: mkdir -p build && odin build tools/ocntools -collection:gt=ext/gui_toolkit/src -out:build/ocntools
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends webp   # (cwebp: the screenshots in WebP, site build)
      - run: build/ocntools site build site _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
