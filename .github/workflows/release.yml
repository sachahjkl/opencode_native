name: Release

# A version tag vX.Y.Z (or vX.Y.Z-beta.N: a pre-release) builds the program for Windows and for Linux and publishes both with the
# release (made from the CHANGELOG's section of that version when it does not exist yet; its assets replaced when it does), with
# one SHA256SUMS.txt. The tag must match APP_VERSION (src/setup.odin). Each program goes with the signed manifests of its
# channels (docs/updates.md): a beta reaches the beta channel, a release both; the rolling release channel-beta is where that
# channel reads.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-odin

      - name: Build (build.bat)
        shell: cmd
        run: call build.bat release

      # the tag must be APP_VERSION's; the files and the signed manifests of the channels
      - name: Package and sign (ocntools release dist)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: build/ocntools release dist ${{ github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: build/dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-odin-linux

      - name: Build (build.sh)
        run: ./build.sh release

      - name: Package and sign (ocntools release dist)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: build/ocntools release dist ${{ github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: build/dist/*
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # (ocntools reads the toolkit's update package)

      - uses: ./.github/actions/setup-odin-tools

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish (ocntools release publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: mkdir -p build && odin run tools/ocntools -collection:gt=ext/gui_toolkit/src -out:build/ocntools -- release publish ${{ github.ref_name }} dist
