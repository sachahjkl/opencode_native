name: Release

# A version tag vX.Y.Z (or vX.Y.Z-beta.N: a pre-release) builds the program for Windows and for Linux and publishes both with the
# release (made from the CHANGELOG's section of that version when it does not exist yet; its assets replaced when it does), with
# one SHA256SUMS.txt. The tag must match APP_VERSION (src/setup.odin). The Windows program goes with the signed manifests of its
# channels (docs/updates.md): a beta reaches the beta channel, a release both; the rolling release channel-beta is where that
# channel reads.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-odin

      - name: Check the version
        id: version
        run: |
          $tag = '${{ github.ref_name }}'
          $m = Select-String -Path src\setup.odin -Pattern 'APP_VERSION\s*::\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          if (($tag -replace '-beta.*$', '') -ne "v$v") { throw "tag $tag does not match APP_VERSION $v (src/setup.odin)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build (build.bat)
        shell: cmd
        run: call build.bat release

      - name: Package
        run: build/occtools package ${{ steps.version.outputs.version }}

      - name: Sign the update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $channels = '${{ github.ref_name }}' -match '-beta' ? @('beta') : @('stable', 'beta')
          foreach ($c in $channels) {
            build/occtools update manifest "build/dist/opencode-native-$v-windows-x64.exe" $v $c "build/dist/update-windows-x64-$c.json"
            if ($LASTEXITCODE) { throw "the $c manifest could not be signed" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: build/dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-odin-linux

      - name: Build (build.sh)
        run: ./build.sh release

      - name: Package
        run: build/occtools package "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: build/dist/*
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum opencode-native-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          files=(opencode-native-* SHA256SUMS.txt update-windows-x64-*)
          pre=()
          case "$TAG" in *-beta*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            printf '\n---\n\nAn independent project: not built by the OpenCode team, and not affiliated with them.\n' >> NOTES.md
          gh release create "$TAG" "${files[@]}" "${pre[@]}" --title "opencode native $VERSION" --notes-file NOTES.md
          fi
          # the beta channel's fixed address: the program and its signed manifest
          beta=(opencode-native-*-windows-x64.exe update-windows-x64-beta.json update-windows-x64-beta.json.sig)
          gh release view channel-beta >/dev/null 2>&1 || gh release create channel-beta --prerelease --title "Beta channel" --notes "What the beta channel of the updater reads."
          gh release upload channel-beta "${beta[@]}" --clobber
