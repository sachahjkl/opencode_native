name: Odin on Linux
description: Odin dev-2026-11a (pinned by SHA-256) on the PATH with wgpu-native's static library in its vendor folder, clang, and the libraries the program links (fontconfig)

runs:
  using: composite
  steps:
    - name: clang, fontconfig, unzip
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang lld libfontconfig-dev unzip

    # (the archive kept between runs, keyed by this file, which names the version: GitHub's release downloads may not answer for
    # an hour, a 504 at each try. Its SHA-256 is checked below, whether it came from the cache or the download)
    - name: Odin's archive, cached
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/odin-archive
        key: odin-archive-${{ runner.os }}-${{ hashFiles('.github/actions/setup-odin-linux/action.yml') }}

    - name: Odin dev-2026-11a
      shell: bash
      env:
        ODIN_TAG: dev-2026-11a
        ODIN_SHA256: 65c9f6e97d6f8a30930e151f270ce5aeaa98fe8b2ba49fe067394e2af04f7618
      run: |
        archive="$RUNNER_TEMP/odin-archive/odin-linux-amd64-$ODIN_TAG.tar.gz"
        mkdir -p "$RUNNER_TEMP/odin-archive"
        [ -f "$archive" ] || curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o "$archive" "https://github.com/odin-lang/Odin/releases/download/$ODIN_TAG/odin-linux-amd64-$ODIN_TAG.tar.gz"
        echo "$ODIN_SHA256  $archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/odin" && tar -xzf "$archive" -C "$RUNNER_TEMP/odin"
        dir="$(dirname "$(find "$RUNNER_TEMP/odin" -maxdepth 3 -name odin -type f | head -1)")"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/odin" version

    # (Odin's Linux archive has no wgpu-native: the toolkit's tools/tk fetches it, pinned by SHA-256)
    - name: wgpu-native
      shell: bash
      run: mkdir -p build && odin run ext/gui_toolkit/tools/tk -out:build/tk -- fetch_wgpu
