name: Odin on Linux
description: Odin dev-2026-10 (pinned by SHA-256) on the PATH with wgpu-native's static library in its vendor folder, clang, and the libraries the program links (fontconfig)

runs:
  using: composite
  steps:
    - name: clang, fontconfig, unzip
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang lld libfontconfig-dev unzip

    - name: Odin dev-2026-10
      shell: bash
      env:
        ODIN_TAG: dev-2026-10
        ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
      run: |
        curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_TAG/odin-linux-amd64-$ODIN_TAG.tar.gz"
        echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/odin" && tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
        dir="$(dirname "$(find "$RUNNER_TEMP/odin" -maxdepth 3 -name odin -type f | head -1)")"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/odin" version

    # (Odin's Linux archive has no wgpu-native: the toolkit's script fetches it, pinned by SHA-256)
    - name: wgpu-native
      shell: bash
      run: ext/gui_toolkit/tools/fetch_wgpu.sh odin
