# HTTP for the opencode client: requests and the server-sent event stream, over ureq (HTTP/1.1, blocking, called from
# the client's worker threads), TLS by rustls with the ring provider, certificates checked against the operating
# system's trust store (rustls-platform-verifier). Exposed as C functions (src/lib.rs), used by src/http.odin.
# Versions are pinned here and by ../Cargo.lock; ocntools build builds with --locked.
[package]
name = "ocn_native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
base64 = "=0.22.1"
# images in messages and project logos: decoded and scaled down here, on the client's worker threads
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

# the agents' browser tools: a WebSocket to the server (client-mcp), by the same TLS as the rest
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

# Windows: the Preview panel, a WebView2 child window (the Edge runtime is the system's; its loader is linked in)
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "=0.62.2"

# Linux: the toolkit's native text backend (Fontations, HarfRust, ICU4X; there is no DirectWrite) built into this library,
# the program's only Rust one (its gt_* functions stay exported; build.sh builds with -define:FONT_BACKEND=native
# -define:FONT_NATIVE_LINK=false). Its crates are pinned by its own Cargo.toml and by ../Cargo.lock.
[target.'cfg(target_os = "linux")'.dependencies]
gt_text = { path = "../../ext/gui_toolkit/native/text" }
