# The client's native library: what the toolkit has no Odin equivalent for (the toolkit's Rust crates linked in, and the
# Preview panel's WebView2 on Windows), linked by src/native.odin. HTTP is the toolkit's gt:http, in Odin.
# Versions are pinned here and by ../Cargo.lock; ocntools build builds with --locked.
[package]
name = "ocn_native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

# Windows: the Preview panel, a WebView2 child window (the Edge runtime is the system's; its loader is linked in)
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "=0.62.2"

# The toolkit's Mermaid diagrams (mermaid-svg: a diagram's text to SVG, drawn by the toolkit's svg package), built into this
# library on every system (its gt_mermaid_* functions stay exported; the build passes -define:MERMAID_NATIVE_LINK=false).
[dependencies.gt_mermaid]
path = "../../ext/gui_toolkit/native/mermaid"

# The toolkit's WebP (libwebp from its C sources, no system libwebp), built into this library on every system: gt:image
# decodes every picture, and its gt_webp_* functions come from here (-define:IMAGE_WEBP=true IMAGE_WEBP_NATIVE_LINK=false).
[dependencies.gt_webp]
path = "../../ext/gui_toolkit/native/webp"

# Linux: the toolkit's native text backend (Fontations, HarfRust, ICU4X; there is no DirectWrite) built into this library,
# the program's only Rust one (its gt_* functions stay exported; build.sh builds with -define:FONT_BACKEND=native
# -define:FONT_NATIVE_LINK=false). Its crates are pinned by its own Cargo.toml and by ../Cargo.lock.
[target.'cfg(target_os = "linux")'.dependencies]
gt_text = { path = "../../ext/gui_toolkit/native/text" }
